name: Compiler l'APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Décompresser le code
        run: unzip -o sunnah-vet-agro-code.zip
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compiler
        run: gradle :app:assembleRelease --no-daemon --stacktrace
      - name: Renommer l'APK
        run: cp app/build/outputs/apk/release/app-release.apk "SunnahVetAgro-v1.0.${{ github.run_number }}.apk"
      - name: Publier l'APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Sunnah_Vet_Agro v1.0.${{ github.run_number }}
          files: SunnahVetAgro-*.apk
          make_latest: true
